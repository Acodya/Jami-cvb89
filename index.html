<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>AI Algo Blob</title>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:#f5f7fa; color:#333; }
  .gate { max-width:420px; margin:12vh auto; background:#fff; padding:36px 32px;
           border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
  .gate h1 { font-size:1.4em; margin:0 0 6px; }
  .gate p { color:#6b7280; font-size:.92em; margin:0 0 22px; line-height:1.5; }
  input { width:100%; padding:12px 14px; font-size:1em; border:1px solid #d1d5db;
           border-radius:6px; box-sizing:border-box; }
  button { width:100%; margin-top:12px; padding:12px; font-size:1em; font-weight:600;
            color:#fff; background:#667eea; border:0; border-radius:6px; cursor:pointer; }
  button:disabled { background:#9ca3af; cursor:wait; }
  .err { color:#dc2626; font-size:.9em; margin-top:12px; display:none; }
  .tabs { background:#fff; border-bottom:1px solid #e5e7eb; padding:0 20px; display:none; }
  .tabs button { width:auto; background:none; color:#6b7280; border:0; border-bottom:3px solid transparent;
                  padding:14px 18px; margin:0; font-weight:600; border-radius:0; }
  .tabs button.active { color:#667eea; border-bottom-color:#667eea; }
  pre { background:#fff; padding:20px; overflow:auto; font-size:.82em; line-height:1.5;
         margin:20px; border-radius:8px; }
  .dl { margin:20px; }
  .dl a { display:inline-block; margin-right:12px; margin-bottom:10px; padding:10px 16px;
           background:#667eea; color:#fff; text-decoration:none; border-radius:6px; font-size:.9em; }
  @media (max-width: 768px) {
    .gate { margin:6vh 16px; padding:26px 20px; }
    /* 16px minimum stops iOS Safari zooming in when the field is focused. */
    input { font-size:16px; }
    /* Tabs scroll horizontally rather than wrapping into a broken second row. */
    .tabs { padding:0 8px; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; }
    .tabs::-webkit-scrollbar { display:none; }
    .tabs button { padding:12px 13px; font-size:.9em; }
    pre { margin:10px; padding:12px; font-size:.68em; }
    .dl { margin:16px; }
    .dl a { display:block; margin-right:0; text-align:center; }
  }
</style>
</head>
<body>
<div class="gate" id="gate">
  <h1>AI Algo Blob</h1>
  <p>This page is encrypted. Enter the passphrase to view.</p>
  <input type="password" id="pw" placeholder="Passphrase" autofocus>
  <button id="go">Unlock</button>
  <div class="err" id="err">Incorrect passphrase.</div>
</div>

<div class="tabs" id="tabs">
  <button data-v="dashboard" class="active">Dashboard</button>
  <button data-v="daily_summary">Daily Log</button>
  <button data-v="weekly_digest">Weekly Digest</button>
  <button data-v="files">Downloads</button>
</div>
<div id="view"></div>

<script>
const BUNDLE = {"salt": "NTGXkJSovtyVgm0CJhIphg==", "nonce": "fhog606Hz/uw62+z", "ciphertext": "0p+B7WXEeRj0AX3Rh/kis1M+1KMhGvN63d+sSYVIPTyNd3rA8EWDMaZ/Mj4zzTWSLTyGFxGg8zcpWAy+Cut39njogXrnrSDjz3YtCjFeI7XrLPkxsfH5CFNF0dk5Am/kgPwfjVBkEX3sLg6Bb+4mUExFPJ+nQmqRxGMQZAcLBwJ5F8paObPOn5Qx/sPJlgTFermJqPugZ8ADPkarb4O0SyoLoD5RS24hsmy4dsIJJqTIN4Daf4lV1JiBKI/Ks1vuyRvZGjEP9FxACinyCKmIW0r36DPh2sOL+TJA/K7dgRpPz13+7nej9GULYOSKHbjfCHr8kAouH0G49P2W8LwL34tt1frv5RoR9ayAyjlyY6JWaP5C3nKLMzPHptSRwT6clUzfq8yj5L2adCL5hPasBl0LyFxwNZw/mBwk70GHJzD7YWvyVFT2al4GCA7P8CA+PLWD7SEcju7MNH7wzrfvc18zyfCDpQn9FSR5cO20W2gxj10ZtjSoTRy48iSzVeBHfuKqwrSE7T3gjIWE7on9EQHxBPyUGcVrOjg8dxnfcoaw3SKudhrarVFt32YBUy/gzeGteK65Rhp2EHZDlsisf13hH+qYPWUc7GZB0JadytmGxpSkE8lWEdzO+aBDjeNMbI1W2/7ENfZnVXEXVPLbRaDHHDfNw4f8Ug6xWEBjcwDz5Ev43scAcNdlziSMOL+enVl6w8Ixn6d0FlU4abPmMCEzCQ/UwRx2smLkXKyVJ09qLFII1FFxBdekML6aRTlDtD5RoSNXiaSz/wIr8Q6kUIK5/vjjuWrUPZ3x2Ifi7CCSBbU+IreCvcrhRxHGdPZbr7018X4kBdtEcSItmZlkYuX3+RC5ugRlR39QpHVaCt6lHBVySNS9V/xRTp7s/ak/8yUql1aG6SMQuOrKHmkt979syqfcYuwVeZL7/zRGNuQ8niDQzpYw94+Hy5SO/5I779raWC6DfmyI75wUGsBYOVCDn0Uv+71G7qDEhKII3S+mt+Deuo8MHrMMiBdwyyUopZ4GAhFvnW1brVP48UjxK/pIkmTIS5I2hKZTGNWw068gj8OhesoScVHTQFPSLs0xtFyT1UYqmdDovDCsgcT0grWxHnAk6sh8KFCepbIGTR1wrnWvyUzHzu0EhkOvuWr/sp+4kNbOCRioxTu1v+6KeoUhQvIU0NeZq0KD6HtcvMY1Vty9guL2L82yeYwznHXvgoWEZX7AqVQQdGR/zKfTJcUyKx/hDVgrQ38zN7H4B+5GfARlFuaJu+fay/hdSi5Asp+pO2L9lAuiIggbhQaf2zQLO95++iwYyEQk9VVUcbXKVjyx/JnzI5FFHolAjgM/d57WJB5NNDKXs5xCJvLLWSpqeBDXEYaYaNbS7b3WHAaJL0qs5XJgmts4M8DqnDhKyG4BF+fQ3uwG/NyPQSe102bCDMCs2ShU61CtRkwLnzBHLdsrd5AawpRI8RCGIvzOQqB7yh2PmyEP8ccorlIIbD/wc1c/95OkTuPzjlDC++QQPC8JN8N9WyfwpbdzieajHzr/Ug7e4dKPqGs8Sm7usGL6sm7jsKfjPZ55laje8PxwbKrFntM0HeE9afoUies0rQK/fllZlcx2fjH0zjGRhqbNOn6c0pLW2HmXkn3Us2viNNT0N/olJif+9aYSXoIcX3hXuneYg0NbNgahM7QcULYG0ES91QGXv8jscqvzDxl/M2rVqUEHM1l2xdEAYEpJw+vpj3GEAz6Je7Xbcr/5KID/n/1/5F+ZYtNNl6BvqAFg76Td6EaCANE1l7JJt/ET9R394QVj8Ttd5QE5pXqhxHYNquMJ3Zr6qF4guzaIBy3XHPu0bR/7Fw4M49k9GNBrb6Six/y24qdojTgowJ7eETvH7Sk1rIH0ZmNnGwopgy9mrKsY5x5qLRtLOtZk+MljOCyQCno+6wujTOVmM3l0+C3T0p4lCUgYJYqBFyCLv7sHVQKkbowA6RdLKtrOyVUh+Zzhc0KgA7SolsoRWK+Ln1Pcr3wNCZbViXgVC6xbzXZpufERrYnsIWXxj3M+grp83DWsoPMvWYDFf+eCy2OO6X56U0ueSHEs+YWSplefPBeCUSI2z8Rq++ZwNzH1dr0nmLL8kMsnpNxefWjDAqN/UwjqMDhGogIlzo4D5lMC66uEI+nSj80HZuwWAFnb73mPo3MCQqP5LPAaB/Mo1DFtdjqAzC5A4TTgS7D1goP8bloJG3mkoLdxL3MADIjMGTo=", "iterations": 250000};
let DATA = null;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock() {
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = 'Decrypting...';
  document.getElementById('err').style.display = 'none';
  try {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(document.getElementById('pw').value),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(BUNDLE.salt), iterations:BUNDLE.iterations, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(BUNDLE.nonce) },
      key, b64(BUNDLE.ciphertext));
    DATA = JSON.parse(new TextDecoder().decode(plain));
    document.getElementById('gate').style.display = 'none';
    document.getElementById('tabs').style.display = 'block';
    show('dashboard');
  } catch (e) {
    document.getElementById('err').style.display = 'block';
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  return `<a href="${url}" download="${name}">${name}</a>`;
}

function show(v) {
  const el = document.getElementById('view');
  document.querySelectorAll('.tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.v === v));
  if (v === 'dashboard') {
    el.innerHTML = '<iframe id="fr" style="width:100%;border:0;height:88vh" scrolling="yes"></iframe>';
    const d = document.getElementById('fr').contentWindow.document;
    d.open(); d.write(DATA.dashboard); d.close();
  } else if (v === 'files') {
    el.innerHTML = '<div class="dl">' +
      download('backtest_log.csv', DATA.backtest_csv || '', 'text/csv') +
      download('trades_log.csv', DATA.trades_csv || '', 'text/csv') +
      download('daily_summary.txt', DATA.daily_summary || '', 'text/plain') + '</div>';
  } else {
    el.innerHTML = '<pre></pre>';
    el.querySelector('pre').textContent = DATA[v] || '(nothing recorded yet)';
  }
}

document.getElementById('go').onclick = unlock;
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('tabs').addEventListener('click', e => {
  if (e.target.dataset.v) show(e.target.dataset.v);
});
</script>
</body>
</html>
