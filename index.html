let DATA = null;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock() {
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = 'Decrypting...';
  document.getElementById('err').style.display = 'none';
  try {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(document.getElementById('pw').value),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(BUNDLE.salt), iterations:BUNDLE.iterations, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(BUNDLE.nonce) },
      key, b64(BUNDLE.ciphertext));
    DATA = JSON.parse(new TextDecoder().decode(plain));
    document.getElementById('gate').style.display = 'none';
    document.getElementById('tabs').style.display = 'block';
    show('dashboard');
  } catch (e) {
    document.getElementById('err').style.display = 'block';
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  return `<a href="${url}" download="${name}">${name}</a>`;
}

function show(v) {
  const el = document.getElementById('view');
  document.querySelectorAll('.tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.v === v));
  if (v === 'dashboard') {
    el.innerHTML = '<iframe id="fr" style="width:100%;border:0;height:88vh" scrolling="yes"></iframe>';
    const d = document.getElementById('fr').contentWindow.document;
    d.open(); d.write(DATA.dashboard); d.close();
  } else if (v === 'files') {
    el.innerHTML = '<div class="dl">' +
      download('backtest_log.csv', DATA.backtest_csv || '', 'text/csv') +
      download('trades_log.csv', DATA.trades_csv || '', 'text/csv') +
      download('daily_summary.txt', DATA.daily_summary || '', 'text/plain') + '</div>';
  } else {
    el.innerHTML = '<pre></pre>';
    el.querySelector('pre').textContent = DATA[v] || '(nothing recorded yet)';
  }
}

document.getElementById('go').onclick = unlock;
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('tabs').addEventListener('click', e => {
  if (e.target.dataset.v) show(e.target.dataset.v);
});
</script>
